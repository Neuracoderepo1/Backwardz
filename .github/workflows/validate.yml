name: BACKWARDZ validation and release evidence

on:
  push:
    branches:
      - main
      - fix/frontend-reliability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend, JavaScript syntax and correct-orbit reveal regression
        run: node tests/validate.mjs
      - name: Package manual Netlify deployment files
        uses: actions/upload-artifact@v4
        with:
          name: backwardz-manual-deploy
          path: |
            index.html
            index 5.html
            README.md
            DEPLOYMENT.md
            SECURITY-REVIEW.md
            CHANGELOG.md
            supabase/
            tests/
            .github/workflows/
